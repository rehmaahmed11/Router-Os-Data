<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="An offline-friendly, interactive student lab for MikroTik RouterOS CHR on QEMU x86-64, with a clearly labelled WebFig learning simulator.">
  <title>RouterOS CHR · QEMU x86-64 Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1118;
      --panel: #111a23;
      --panel-2: #151f29;
      --panel-3: #192630;
      --line: #263542;
      --line-soft: rgba(151, 173, 189, .12);
      --text: #edf5f7;
      --muted: #a1b1bb;
      --muted-2: #71838e;
      --lime: #c5f56a;
      --lime-ink: #16200e;
      --cyan: #6ed8de;
      --blue: #81b9ff;
      --amber: #ffc76d;
      --red: #ff8888;
      --shadow: 0 18px 60px rgba(0, 0, 0, .24);
      --radius: 18px;
      --sidebar-width: 292px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
    .sidebar {
      height: 100vh; height: 100dvh; position: sticky; top: 0; overflow-y: auto; z-index: 20;
      display: flex; flex-direction: column; padding: 22px 15px 15px; background: #0d151d;
      border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: #344552 transparent;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 9px 17px; border-bottom: 1px solid var(--line-soft); }
    .brand-symbol { width: 39px; height: 39px; display: grid; place-items: center; flex: 0 0 39px; border-radius: 12px; color: var(--lime); background: rgba(197,245,106,.1); border: 1px solid rgba(197,245,106,.25); }
    .brand-symbol svg { width: 23px; height: 23px; }
    .brand-name { font-weight: 770; font-size: 14px; letter-spacing: -.02em; line-height: 1.25; }
    .brand-sub { font-size: 10px; color: var(--muted-2); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
    .lab-pill { display: flex; align-items: center; gap: 7px; width: fit-content; margin: 15px 8px 17px; padding: 6px 9px; border-radius: 999px; border: 1px solid rgba(255,199,109,.24); color: #f9d898; background: rgba(255,199,109,.07); font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .lab-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(255,199,109,.11); }
    .sidebar-tools { display: grid; gap: 8px; padding: 0 5px 16px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 11px; width: 15px; height: 15px; stroke: var(--muted-2); pointer-events: none; }
    .search-input { width: 100%; height: 38px; padding: 0 12px 0 36px; color: var(--text); outline: 0; background: #101a23; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
    .search-input:focus, input:focus { border-color: rgba(197,245,106,.65); box-shadow: 0 0 0 3px rgba(197,245,106,.1); }
    .sidebar-nav { padding: 0 2px; }
    .nav-section { margin: 0 0 13px; }
    .nav-section-title { display: flex; align-items: center; justify-content: space-between; padding: 0 9px 7px; color: #71838e; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
    .nav-section-count { color: #526672; font-variant-numeric: tabular-nums; }
    .nav-item { position: relative; width: 100%; min-height: 36px; display: flex; gap: 9px; align-items: center; padding: 7px 9px; margin: 2px 0; border: 1px solid transparent; border-radius: 9px; text-align: left; color: #a8b8c1; background: transparent; cursor: pointer; transition: .16s ease; }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,.035); }
    .nav-item.active { color: var(--text); border-color: rgba(197,245,106,.16); background: rgba(197,245,106,.075); }
    .nav-item.active::before { content: ""; position: absolute; left: -3px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--lime); }
    .nav-icon { flex: 0 0 19px; width: 19px; text-align: center; font-size: 13px; opacity: .85; }
    .nav-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 570; }
    .nav-num { margin-left: auto; color: #637681; font-size: 9px; font-variant-numeric: tabular-nums; }
    .nav-done { width: 14px; height: 14px; display: grid; place-items: center; margin-left: auto; border-radius: 50%; color: #0e1709; background: var(--lime); font-size: 9px; font-weight: 900; }
    .sidebar-bottom { margin-top: auto; padding: 15px 8px 0; border-top: 1px solid var(--line-soft); }
    .side-progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; color: var(--muted); font-size: 10px; }
    .side-progress-top strong { color: var(--text); font-size: 11px; }
    .progress-track { height: 5px; overflow: hidden; border-radius: 9px; background: #26343e; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8ccf52, var(--lime)); transition: width .25s ease; }
    .side-small { padding-top: 12px; color: #637681; font-size: 9px; line-height: 1.55; }
    .main-column { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 10; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 34px; background: rgba(11,17,24,.91); border-bottom: 1px solid var(--line-soft); backdrop-filter: blur(14px); }
    .top-left { min-width: 0; display: flex; align-items: center; gap: 11px; }
    .mobile-menu { display: none !important; }
    .crumb { color: #738691; font-size: 11px; white-space: nowrap; }
    .crumb strong { color: #dae6e9; font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .progress-chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; color: #b3c2c9; border: 1px solid var(--line); background: #101820; border-radius: 9px; font-size: 10px; white-space: nowrap; }
    .progress-chip b { color: var(--lime); font-variant-numeric: tabular-nums; }
    .btn { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; color: #dce7ea; background: #15212a; font-size: 11px; font-weight: 700; cursor: pointer; transition: .16s ease; text-decoration: none; }
    .btn:hover { background: #1b2a35; border-color: #415361; transform: translateY(-1px); }
    .btn:focus-visible, .nav-item:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    .btn.primary { color: var(--lime-ink); background: var(--lime); border-color: var(--lime); }
    .btn.primary:hover { background: #d3fb8a; }
    .btn.ghost { color: #a9bac1; background: transparent; }
    .btn.small { min-height: 31px; padding: 6px 9px; font-size: 10px; }
    .btn svg { width: 14px; height: 14px; }
    main { max-width: 1600px; margin: 0 auto; padding: 34px 38px 74px; }
    .eyebrow { color: var(--lime); text-transform: uppercase; letter-spacing: .13em; font-size: 9px; font-weight: 850; }
    .home-hero { position: relative; overflow: hidden; min-height: 250px; display: grid; grid-template-columns: minmax(0,1.15fr) minmax(220px,.85fr); gap: 24px; align-items: center; padding: 31px 34px; border: 1px solid #2b3a44; border-radius: 22px; background: radial-gradient(circle at 82% 9%, rgba(110,216,222,.13), transparent 27%), linear-gradient(125deg, #16232c 0%, #121b24 53%, #172621 100%); box-shadow: var(--shadow); }
    .home-hero::after { content: ""; position: absolute; right: -70px; bottom: -156px; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(197,245,106,.12); box-shadow: 0 0 0 32px rgba(197,245,106,.025), 0 0 0 66px rgba(197,245,106,.02); pointer-events: none; }
    .hero-copy, .hero-side { position: relative; z-index: 1; }
    h1, h2, h3, p { margin-top: 0; }
    .home-hero h1 { max-width: 700px; margin: 13px 0 13px; font-size: clamp(31px, 4vw, 51px); line-height: 1.02; letter-spacing: -.052em; font-weight: 780; }
    .home-hero h1 em { color: var(--lime); font-style: normal; }
    .home-hero p { max-width: 640px; margin-bottom: 21px; color: #a8bbc4; font-size: 13px; line-height: 1.7; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .hero-side { justify-self: end; width: min(100%, 335px); }
    .stat-card { padding: 16px; border: 1px solid rgba(181,203,209,.14); border-radius: 15px; background: rgba(8,14,19,.47); backdrop-filter: blur(12px); }
    .stat-card-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .stat-title { color: #94a8b2; font-size: 10px; }
    .status-tag { display: inline-flex; gap: 6px; align-items: center; padding: 5px 8px; border: 1px solid rgba(255,199,109,.25); color: #f7d18a; border-radius: 6px; font-size: 8px; font-weight: 850; letter-spacing: .08em; }
    .status-tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; }
    .stat-number { display: block; color: var(--text); font-size: 23px; line-height: 1.2; font-weight: 760; letter-spacing: -.04em; }
    .stat-label { color: #82949d; font-size: 9px; }
    .honesty-banner { display: flex; gap: 12px; align-items: flex-start; margin: 18px 0 22px; padding: 13px 15px; border: 1px solid rgba(255,199,109,.24); border-radius: 12px; color: #dcc99f; background: rgba(255,199,109,.055); font-size: 11px; line-height: 1.62; }
    .honesty-banner strong { color: #ffe0a1; }
    .notice-icon { flex: 0 0 20px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: var(--amber); background: rgba(255,199,109,.12); font-size: 11px; font-weight: 900; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin: 30px 0 13px; }
    .section-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .architecture { display: grid; grid-template-columns: repeat(4,1fr); gap: 9px; }
    .arch-card { position: relative; min-height: 116px; padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .arch-card:not(:last-child)::after { content: "›"; position: absolute; right: -10px; top: 44%; z-index: 2; width: 18px; height: 18px; display: grid; place-items: center; color: var(--lime); background: #0b1118; font-size: 18px; }
    .arch-no { color: #697e88; font-size: 9px; font-weight: 800; }
    .arch-card h3 { margin: 14px 0 5px; font-size: 12px; }
    .arch-card p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .map-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 11px; }
    .map-card { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: #101820; }
    .map-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
    .map-card-head strong { color: #e4eef0; font-size: 11px; }
    .map-card-head span { color: #8497a0; font-size: 9px; }
    .map-card p { margin: 0; color: #94a6af; font-size: 10px; line-height: 1.6; }
    .bottom-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(280px,.8fr); gap: 13px; margin-top: 28px; }
    .info-card { padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); }
    .info-card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: -.02em; }
    .info-card > p { color: var(--muted); font-size: 10px; line-height: 1.6; }
    .prereq-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
    .prereq-list li { display: flex; gap: 8px; align-items: start; padding: 9px; border-radius: 9px; color: #b4c2c7; background: #16212a; font-size: 9px; line-height: 1.5; }
    .check-mark { flex: 0 0 15px; color: var(--lime); font-weight: 900; }
    .url-form { display: flex; gap: 7px; margin-top: 12px; }
    .field { min-width: 0; flex: 1; height: 37px; padding: 0 11px; outline: none; color: var(--text); background: #0c141b; border: 1px solid #31424d; border-radius: 8px; font-size: 10px; }
    .field-label { display: block; margin: 12px 0 6px; color: #a5b5bc; font-size: 9px; font-weight: 700; }
    .small-note { margin: 9px 0 0 !important; color: #738690 !important; font-size: 9px !important; line-height: 1.5 !important; }
    .doc-links { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .doc-link { display: inline-flex; gap: 5px; align-items: center; padding: 6px 8px; color: #a9bdc5; border: 1px solid #30414c; border-radius: 7px; font-size: 9px; text-decoration: none; }
    .doc-link:hover { color: var(--lime); border-color: rgba(197,245,106,.3); }
    .module-header { margin: 6px 0 23px; }
    .module-kicker { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 10px; }
    .module-kicker .step-count { color: var(--lime); font-weight: 850; letter-spacing: .08em; }
    .layer-pill { padding: 5px 8px; border: 1px solid #2d414b; border-radius: 999px; color: #8fa4ad; background: #111a22; font-size: 9px; }
    .module-header h1 { margin: 13px 0 8px; font-size: clamp(26px, 3vw, 38px); line-height: 1.1; letter-spacing: -.045em; }
    .module-header > p { max-width: 840px; margin: 0; color: #9daeb7; font-size: 12px; line-height: 1.65; }
    .module-grid { display: grid; grid-template-columns: minmax(0,1.13fr) minmax(335px,.87fr); align-items: start; gap: 18px; }
    .lesson-card { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 10px 34px rgba(0,0,0,.12); }
    .goal-box { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 11px; align-items: start; padding: 14px; border: 1px solid rgba(197,245,106,.16); border-radius: 12px; background: rgba(197,245,106,.045); }
    .goal-icon { width: 28px; height: 28px; display: grid; place-items: center; color: var(--lime); border-radius: 8px; background: rgba(197,245,106,.11); font-size: 13px; }
    .goal-box strong { display: block; margin: 1px 0 4px; font-size: 11px; }
    .goal-box p { margin: 0; color: #afc0c5; font-size: 10px; line-height: 1.6; }
    .lesson-section { margin-top: 20px; }
    .lesson-section h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; letter-spacing: -.02em; }
    .section-index { width: 19px; height: 19px; display: grid; place-items: center; border-radius: 6px; color: #a8bdc4; background: #1a2933; font-size: 9px; }
    .lesson-section > p { margin: 0 0 9px; color: #9eafb7; font-size: 10px; line-height: 1.65; }
    .action-list { display: grid; gap: 8px; margin: 0; padding: 0; counter-reset: actions; list-style: none; }
    .action-list li { position: relative; min-height: 36px; display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; color: #b6c4c9; font-size: 10px; line-height: 1.65; }
    .action-list li::before { counter-increment: actions; content: counter(actions); width: 21px; height: 21px; display: grid; place-items: center; border: 1px solid #2d404b; border-radius: 7px; color: #9fb1b8; background: #16212a; font-size: 9px; font-weight: 800; }
    .action-list strong { color: #e2ecee; }
    .path-strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 11px 0 0; }
    .path-item { padding: 5px 7px; border: 1px solid #2b3d47; border-radius: 6px; color: #afc0c5; background: #121d25; font-size: 9px; }
    .path-chevron { color: #667b85; font-size: 10px; }
    .concept-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }
    .concept-cell { padding: 11px; border: 1px solid #273944; border-radius: 10px; background: #121c24; }
    .concept-cell span { display: block; margin-bottom: 5px; color: #738993; text-transform: uppercase; font-size: 8px; font-weight: 850; letter-spacing: .1em; }
    .concept-cell p { margin: 0; color: #b4c2c7; font-size: 9px; line-height: 1.55; }
    .code-card { overflow: hidden; margin-top: 12px; border: 1px solid #263945; border-radius: 11px; background: #0b131a; }
    .code-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #202f38; background: #121c24; }
    .code-head span { color: #8da1aa; font-size: 9px; font-weight: 750; }
    pre { max-width: 100%; overflow: auto; margin: 0; padding: 12px; color: #c9e6d0; font-size: 9px; line-height: 1.62; tab-size: 2; white-space: pre; scrollbar-width: thin; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .verify-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .verify-list li { display: grid; grid-template-columns: 16px 1fr; gap: 7px; align-items: start; color: #aebdc3; font-size: 10px; line-height: 1.55; }
    .verify-list li::before { content: "✓"; display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; color: var(--lime); background: rgba(197,245,106,.12); font-size: 9px; font-weight: 900; }
    .caution-box { display: flex; gap: 9px; align-items: flex-start; margin-top: 12px; padding: 11px; border: 1px solid rgba(255,199,109,.17); border-radius: 10px; color: #bfaf8e; background: rgba(255,199,109,.04); font-size: 9px; line-height: 1.6; }
    .caution-box strong { color: #f5d89f; }
    .caution-symbol { color: var(--amber); font-size: 12px; }
    .live-connect-card { margin-top: 15px; padding: 13px; border: 1px solid rgba(110,216,222,.18); border-radius: 11px; background: rgba(110,216,222,.045); }
    .live-connect-card h3 { margin: 0 0 4px; font-size: 11px; }
    .live-connect-card p { margin: 0; color: #9db0b7; font-size: 9px; line-height: 1.55; }
    .live-connect-card .url-form { margin-top: 10px; }
    .quiz-box { margin-top: 16px; padding: 13px; border: 1px solid #2c3d47; border-radius: 11px; background: #121c24; }
    .quiz-box h3 { margin: 0 0 9px; font-size: 11px; }
    .quiz-question { margin: 0 0 9px; color: #c5d2d6; font-size: 10px; line-height: 1.5; }
    .quiz-options { display: grid; gap: 6px; }
    .quiz-option { display: flex; gap: 8px; align-items: start; padding: 8px; border: 1px solid #273842; border-radius: 8px; color: #aebdc3; background: #101820; cursor: pointer; font-size: 9px; line-height: 1.5; }
    .quiz-option:has(input:checked) { border-color: rgba(197,245,106,.34); background: rgba(197,245,106,.04); }
    .quiz-option input { accent-color: var(--lime); margin: 2px 0 0; }
    .quiz-feedback { min-height: 14px; margin: 8px 0 0; color: #8ba0a7; font-size: 9px; }
    .quiz-feedback.good { color: var(--lime); }
    .quiz-feedback.bad { color: #ffbd79; }
    .lesson-footer { display: flex; justify-content: space-between; align-items: center; gap: 9px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
    .lesson-footer .left-actions, .lesson-footer .right-actions { display: flex; gap: 7px; }
    .visual-card { position: sticky; top: 81px; overflow: hidden; min-width: 0; border: 1px solid #2b3c47; border-radius: var(--radius); background: #0f171e; box-shadow: var(--shadow); }
    .visual-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 13px; border-bottom: 1px solid #26343d; background: #131e27; }
    .visual-head strong { display: block; margin-top: 4px; font-size: 10px; }
    .visual-head .eyebrow { font-size: 8px; }
    .visual-mode { padding: 5px 7px; color: #ffd88e; border: 1px solid rgba(255,199,109,.23); border-radius: 6px; background: rgba(255,199,109,.055); font-size: 8px; font-weight: 850; letter-spacing: .07em; white-space: nowrap; }
    .screen-wrap { padding: 12px; }
    .screen-note { display: flex; justify-content: space-between; gap: 8px; margin: 8px 1px 0; color: #71858e; font-size: 8px; line-height: 1.5; }
    .mock-browser { overflow: hidden; border: 1px solid #334651; border-radius: 9px; background: #f4f6f7; color: #25343d; box-shadow: 0 8px 22px rgba(0,0,0,.22); }
    .mock-chrome { height: 29px; display: flex; gap: 7px; align-items: center; padding: 0 9px; background: #e7ecef; border-bottom: 1px solid #d5dce0; }
    .browser-dots { display: flex; gap: 3px; }
    .browser-dots i { width: 5px; height: 5px; border-radius: 50%; background: #a4b0b6; }
    .mock-address { flex: 1; overflow: hidden; padding: 4px 8px; border-radius: 4px; background: #f9fbfb; color: #64777f; font-family: ui-monospace, monospace; font-size: 7px; white-space: nowrap; text-overflow: ellipsis; }
    .mock-shield { color: #87999f; font-size: 8px; }

  <script>
    const officialDocs = {
      download: 'https://mikrotik.com/download',
      chr: 'https://help.mikrotik.com/docs/exportword?pageId=18350234',
      first: 'https://help.mikrotik.com/docs/spaces/ROS/pages/328151/First+Time+Configuration',
      services: 'https://help.mikrotik.com/docs/spaces/ROS/pages/103841820/Services',
      backup: 'https://help.mikrotik.com/docs/spaces/ROS/pages/328155/Configuration+Management',
      identity: 'https://help.mikrotik.com/docs/spaces/ROS/pages/40992856/Identity'
    };

    const lessons = [
      {
        id: 'image', section: 'Prepare & boot', icon: '⬇', title: 'Get the official CHR image', minutes: 4,
        layer: 'Layer 0 · Vendor image', screen: 'download', path: ['MikroTik Download', 'Cloud Hosted Router', 'QEMU / KVM'],
        goal: 'Choose the official x86-64 Cloud Hosted Router (CHR) virtual disk. CHR is RouterOS packaged to run as a virtual machine; it is not a generic ISO installer.',
        why: 'Starting from the vendor image keeps the lab reproducible and avoids unknown preconfigured accounts, scripts, or network exposure.',
        steps: [
          'Open the <strong>MikroTik download page</strong> and select the current <strong>Stable</strong> release, then find the Cloud Hosted Router (CHR) section.',
          'For QEMU/KVM, download the <strong>qcow2</strong> image archive. The raw <code>.img</code> image also works when you set QEMU disk format to <code>raw</code>. Do not choose the RouterOS x86 ISO for this CHR disk-image workflow.',
          'Extract the archive on your own lab host. Keep the original download and version number; do not commit the proprietary router image or license material to this repository.'
        ],
        verify: ['The extracted filename is a CHR image and the release version is recorded.', 'QEMU will use <code>format=qcow2</code> for a .qcow2 disk, or <code>format=raw</code> for a .img disk.', 'You downloaded it from MikroTik, not from a third-party mirror.'],
        caution: 'CHR is MikroTik software and is subject to its license terms. This learning page contains no firmware image. Use the current official download and review CHR licensing before deploying beyond a disposable lab.',
        links: [{ label: 'Official CHR downloads ↗', url: officialDocs.download }, { label: 'CHR system requirements ↗', url: officialDocs.chr }]
      },
      {
        id: 'qemu', section: 'Prepare & boot', icon: '▣', title: 'Prepare QEMU x86-64', minutes: 6,
        layer: 'Layer 1 · Host / hypervisor', screen: 'qemu', path: ['64-bit host', 'QEMU system emulator', 'CHR virtual disk'],
        goal: 'Give CHR a virtual CPU, memory, disk, and one emulated Ethernet interface. The example forwards only the host loopback port 8080 to the guest WebFig HTTP port 80.',
        why: 'QEMU user-mode networking avoids bridging the guest onto a real LAN. Binding the forwarded port to 127.0.0.1 makes this a host-only teaching endpoint instead of a service exposed to the network.',
        steps: [
          'Install QEMU for your host OS. On Debian/Ubuntu, the system packages are <code>qemu-system-x86</code> and <code>qemu-utils</code>. On other operating systems, use the distribution package or QEMU installer.',
          'Put the extracted CHR image in a working folder. Change the placeholder filename and version in the command below to match the file you actually downloaded.',
          'On Linux with KVM access, use the fast command shown. If KVM is unavailable, remove <code>-accel kvm -cpu host</code> and use <code>-accel tcg -cpu qemu64</code> instead; emulation will be slower. On macOS, select the host-supported accelerator.',
          'Start QEMU in a terminal you can keep open. This single-NIC starter topology is for management and learning; a separate host-only LAN is needed to test a LAN client end-to-end.'
        ],
        commands: 'qemu-system-x86_64 \\\n  -machine q35 -accel kvm -cpu host \\\n  -m 1024M -smp 2 \\\n  -drive file=chr-<VERSION>.qcow2,if=virtio,format=qcow2 \\\n  -netdev user,id=wan0,hostfwd=tcp:127.0.0.1:8080-:80 \\\n  -device virtio-net-pci,netdev=wan0 \\\n  -nographic',
        codeLabel: 'Linux + KVM · edit image filename/version before use',
        verify: ['QEMU starts without a disk-format or accelerator error.', 'The guest gets one virtual Ethernet interface; it will commonly appear as <code>ether1</code>. Always confirm the actual interface name in RouterOS.', 'The host forward listens only on 127.0.0.1:8080, not on every host network interface.'],
        caution: 'Do not change <code>127.0.0.1</code> to <code>0.0.0.0</code> for a classroom/public host. The sample uses plain HTTP for a local disposable lab only. Never expose WebFig or a default/weak account to the Internet.',
        quiz: { question: 'What does the QEMU hostfwd entry do in this command?', options: ['Publishes the router to every device on the LAN', 'Forwards host loopback port 8080 to guest TCP port 80', 'Changes the CHR admin password'], answer: 1, explanation: 'Correct: traffic to 127.0.0.1:8080 on the QEMU host is forwarded to port 80 inside the guest.' }
      },
      {
        id: 'boot', section: 'Prepare & boot', icon: '⏵', title: 'Boot CHR and inspect the console', minutes: 5,
        layer: 'Layer 2 · RouterOS guest', screen: 'boot', path: ['QEMU console', 'RouterOS boot', 'Login prompt'],
        goal: 'Wait for RouterOS to finish booting, identify the login prompt, and confirm the VM is responsive before moving to WebFig.',
        why: 'The virtual machine is the actual router. WebFig is only its browser-based management service, so the guest must be running and its management service reachable first.',
        steps: [
          'Watch the QEMU terminal. Give the first boot a minute or two; the VM may initialize disk space and restart once depending on the image.',
          'At the RouterOS login prompt, the initial user is usually <code>admin</code> with no password. Press Enter at the password prompt if the image asks for one. Follow any first-login prompt that explicitly asks you to set a new password.',
          'If the console is blank, check QEMU serial/console settings and confirm that the virtual disk image is the CHR image. Do not repeatedly reset the disk just because boot takes a short while.'
        ],
        commands: '/system resource print\n/system package print\n/ip dhcp-client print detail',
        codeLabel: 'Optional console checks · these do not change configuration',
        verify: ['The RouterOS prompt appears and accepts a login.', 'The resource output reports RouterOS/CHR and expected virtual CPU/memory.', 'For user-mode networking, inspect whether a DHCP client is present and bound on the WAN interface; do not assume a particular interface name without checking.'],
        caution: 'A first-login empty password is not acceptable after setup. Change it before leaving the VM running or opening management access.',
        quiz: { question: 'Which statement best describes CHR?', options: ['A virtual-machine edition of RouterOS for x86-64', 'A WebFig browser extension', 'A QEMU network adapter'], answer: 0, explanation: 'Correct: CHR is MikroTik RouterOS built for virtual-machine deployment.' }
      },
      {
        id: 'password', section: 'Secure & connect', icon: '⌑', title: 'Set the admin password', minutes: 4,
        layer: 'Layer 3 · RouterOS identity', screen: 'password', path: ['RouterOS console', 'User admin', 'Password rotation'],
        goal: 'Replace the empty first-login password with a strong, unique secret before connecting through WebFig.',
        why: 'An empty or shared administrator password turns an otherwise isolated VM into an easy takeover target. A password belongs in your password manager—not in a screenshot, transcript, HTML file, or chat.',
        steps: [
          'If the first-login wizard prompts you to set a password, set it there and confirm it. Otherwise, at the RouterOS console run <code>/password</code>.',
          'When asked for the old password, press Enter if the existing password is blank. Enter a strong, unique password twice when prompted. The prompt should mask the characters.',

      return `<div class="module-header"><div class="module-kicker"><span class="step-count">${String(idx).padStart(2, '0')} / ${String(lessons.length).padStart(2, '0')}</span><span>·</span><span>${esc(lesson.section)}</span><span>·</span><span>${lesson.minutes} min</span><span class="layer-pill">${esc(lesson.layer)}</span></div><h1>${esc(lesson.title)}</h1><p>${esc(lesson.goal)}</p></div>
      <div class="module-grid"><article class="lesson-card"><div class="goal-box"><div class="goal-icon">◎</div><div><strong>What you are learning</strong><p>${esc(lesson.why)}</p></div></div>
      <section class="lesson-section"><h2><span class="section-index">1</span> Do the setup</h2><ol class="action-list">${stepsHtml}</ol>${pathStrip(lesson.path)}${commandHtml}${connectHtml}</section>
      <section class="lesson-section"><h2><span class="section-index">2</span> Verify before continuing</h2><ul class="verify-list">${verifyHtml}</ul></section>
      ${cautionHtml ? `<section class="lesson-section"><h2><span class="section-index">!</span> Safety and rollback</h2>${cautionHtml}</section>` : ''}
      ${renderQuiz(lesson.quiz, lesson.id)}${linksHtml}
      <div class="lesson-footer"><div class="left-actions"><button class="btn ghost small" type="button" data-go-overview>Overview</button>${before ? `<button class="btn small" type="button" data-go-step="${esc(before.id)}">← Previous</button>` : ''}</div><div class="right-actions"><button class="btn small ${done ? '' : 'primary'}" type="button" data-toggle-done="${esc(lesson.id)}">${done ? '✓ Completed' : 'Mark complete'}</button>${after ? `<button class="btn small" type="button" data-go-step="${esc(after.id)}">Next →</button>` : ''}</div></div></article>
      <aside class="visual-card"><div class="visual-head"><div><span class="eyebrow">Learning screen</span><strong>${esc(lesson.title)}</strong></div><span class="visual-mode">ILLUSTRATIVE</span></div><div class="screen-wrap">${renderScreen(lesson)}<div class="screen-note"><span>WebFig / console training mock</span><span>No router connection</span></div></div>${renderLayerStack(lesson)}<div class="visual-foot"><span>Use the lesson list to explore every screen.</span><div class="screen-switch"><button type="button" aria-label="Previous lesson" data-go-step="${before ? esc(before.id) : esc(lesson.id)}">←</button><button type="button" aria-label="Next lesson" data-go-step="${after ? esc(after.id) : esc(lesson.id)}">→</button></div></div></aside></div>
      <div class="footer-note">Training mock only — this panel is not a screenshot or a live MikroTik WebFig session. To work on a real CHR, open the host-local WebFig URL above in another tab. Never paste credentials into this course.</div>`;
    }
    function renderApp(scrollToTop = false) {
      renderNav();
      if (activeId === 'overview') {
        document.getElementById('breadcrumb').innerHTML = '<strong>Overview</strong><span> / </span>Student lab';
        mainContent.innerHTML = renderOverview();
      } else {
        const lesson = lessons.find((item) => item.id === activeId) || lessons[0];
        document.getElementById('breadcrumb').innerHTML = `<strong>${esc(lesson.section)}</strong><span> / </span>${esc(lesson.title)}`;
        mainContent.innerHTML = renderLesson(lesson);
      }
      bindLiveUrlInput();
      if (scrollToTop) { window.scrollTo({ top: 0, behavior: 'smooth' }); mainContent.focus({ preventScroll: true }); }
    }
    function bindLiveUrlInput() {
      const field = document.getElementById('liveUrl');
      if (field) field.addEventListener('input', () => { liveUrl = field.value; });
    }
    function goTo(id, scroll = true) {
      activeId = id;
      renderApp(scroll);
      closeMobileNav();
    }
    function closeMobileNav() {
      sidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('show');
    }
    function openLiveWebfig() {
      const field = document.getElementById('liveUrl');
      const raw = field ? field.value.trim() : liveUrl.trim();
      liveUrl = raw || 'http://127.0.0.1:8080';
      let parsed;
      try { parsed = new URL(liveUrl); } catch (_) { showToast('Enter a complete URL such as http://127.0.0.1:8080'); return; }
      if (!['http:', 'https:'].includes(parsed.protocol) || parsed.username || parsed.password) {
        showToast('Use an http:// or https:// URL without embedding credentials.');
        return;
      }
      window.open(parsed.href, '_blank', 'noopener,noreferrer');
      showToast('Opened a new tab. Sign in on the router page; this guide does not handle credentials.');
    }
    function markDone(id) {
      if (completed.has(id)) completed.delete(id); else completed.add(id);
      saveProgress();
      renderApp(false);
      showToast(completed.has(id) ? 'Lesson marked complete.' : 'Lesson marked incomplete.');
    }
    function copyCommand(button) {
      const code = button.closest('.code-card')?.querySelector('code')?.textContent || '';
      if (!code) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => showToast('Command copied. Review placeholders and interface names before running.')).catch(() => showToast('Clipboard unavailable. Select and copy the command manually.'));
      } else {
        const temp = document.createElement('textarea');
        temp.value = code; temp.setAttribute('readonly', ''); temp.style.position = 'fixed'; temp.style.opacity = '0';
        document.body.appendChild(temp); temp.select();
        try { document.execCommand('copy'); showToast('Command copied. Review placeholders and interface names before running.'); }
        catch (_) { showToast('Clipboard unavailable. Select and copy the command manually.'); }
        temp.remove();
      }
    }

    document.addEventListener('click', (event) => {
      const step = event.target.closest('[data-step]');
      if (step) { goTo(step.dataset.step); return; }
      if (event.target.closest('[data-overview], [data-go-overview]')) { goTo('overview'); return; }
      const go = event.target.closest('[data-go-step]');
      if (go) { goTo(go.dataset.goStep); return; }
      if (event.target.closest('[data-start-demo]')) { goTo('image'); return; }
      if (event.target.closest('[data-toggle-done]')) { markDone(event.target.closest('[data-toggle-done]').dataset.toggleDone); return; }
      if (event.target.closest('[data-copy-command]')) { copyCommand(event.target.closest('[data-copy-command]')); return; }
      if (event.target.closest('[data-open-webfig]')) { openLiveWebfig(); return; }
      const check = event.target.closest('[data-check-quiz]');
      if (check) {
        const id = check.dataset.checkQuiz;
        const lesson = lessons.find((item) => item.id === id);
        const box = check.closest('.quiz-box');
        const selected = box.querySelector(`input[name="quiz-${id}"]:checked`);
        const feedback = box.querySelector('.quiz-feedback');
        feedback.className = 'quiz-feedback';
        if (!selected) { feedback.textContent = 'Choose an answer first.'; return; }
        if (Number(selected.value) === lesson.quiz.answer) { feedback.classList.add('good'); feedback.textContent = lesson.quiz.explanation; }
        else { feedback.classList.add('bad'); feedback.textContent = 'Not quite. Re-read the layer and path above, then try again.'; }
        return;
      }
    });
    lessonSearch.addEventListener('input', () => { filterText = lessonSearch.value; renderNav(); });
    document.getElementById('resetProgress').addEventListener('click', () => {
      if (!completed.size) { showToast('No saved checkmarks to clear.'); return; }
      if (window.confirm('Clear all lesson checkmarks saved in this browser?')) { completed.clear(); saveProgress(); renderApp(false); showToast('Lesson progress cleared.'); }
    });
    document.getElementById('mobileMenu').addEventListener('click', () => { sidebar.classList.add('open'); sidebarBackdrop.classList.add('show'); });
    sidebarBackdrop.addEventListener('click', closeMobileNav);
    document.addEventListener('keydown', (event) => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
      const index = currentIndex();
      if (event.key === 'ArrowRight' && activeId !== 'overview' && index >= 0 && index < lessons.length - 1) goTo(lessons[index + 1].id);
      if (event.key === 'ArrowLeft' && activeId !== 'overview' && index > 0) goTo(lessons[index - 1].id);
      if (event.key === 'Escape') closeMobileNav();
    });
    renderApp(false);
  </script>
</body>
</html>
